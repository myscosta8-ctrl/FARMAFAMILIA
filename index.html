<style>

    --pine:#B7251E;        /* vermelho da marca — cabeçalho, menu, botões */

<script>
// ============================================================
//  CONEXÃO COM O BANCO (Supabase)
// ============================================================
const SUPABASE_URL = "https://cseypzniovlxvujapxgv.supabase.co";
const SUPABASE_KEY = "sb_publishable_4yig9S3CCenfU7ff7HNtbQ_MztE4zfy";

const Sessao = {
  ler(){ try{ return JSON.parse(localStorage.getItem('sessao')) }catch{ return null } },
  gravar(s){ try{ localStorage.setItem('sessao', JSON.stringify(s)) }catch{} },
  limpar(){ try{ localStorage.removeItem('sessao') }catch{} },
};

async function entrar(email, senha){
  const r = await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{
    method:'POST',
    headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email:email,password:senha})
  });
  const d = await r.json();
  if(!r.ok) throw new Error(d.error_description || d.msg || 'E-mail ou senha inválidos');
  Sessao.gravar({token:d.access_token, refresh:d.refresh_token, email:(d.user&&d.user.email)||email});
  return d;
}

async function renovarSessao(){
  const s = Sessao.ler(); if(!s || !s.refresh) return false;
  const r = await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{
    method:'POST',
    headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:s.refresh})
  });
  if(!r.ok) return false;
  const d = await r.json();
  Sessao.gravar({token:d.access_token, refresh:d.refresh_token, email:(d.user&&d.user.email)||s.email});
  return true;
}

// Chamada à API de dados. Renova a sessão sozinha se o acesso expirar.
async function api(caminho, opcoes, jaRenovou){
  opcoes = opcoes || {};
  const s = Sessao.ler();
  const cab = {
    'apikey':SUPABASE_KEY,
    'Authorization':'Bearer '+((s&&s.token)||SUPABASE_KEY),
    'Content-Type':'application/json',
    'Prefer':'return=representation'
  };
  const r = await fetch(SUPABASE_URL+'/rest/v1/'+caminho, {
    method:opcoes.method||'GET',
    headers:cab,
    body:opcoes.body
  });
  if(r.status===401 && !jaRenovou){
    if(await renovarSessao()) return api(caminho, opcoes, true);
    Sessao.limpar(); mostrarLogin('Sessão expirada. Entre novamente.');
    throw new Error('Sessão expirada');
  }
  if(!r.ok){
    const t = await r.text();
    throw new Error('Erro ao salvar: '+t.slice(0,140));
  }
  if(r.status===204) return null;
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}

// Lê valores no formato brasileiro com segurança:
// "1.771,19" -> 1771.19 | "177119" -> 177119 | "1771,19" -> 1771.19
// "1.771" -> 1771 (ponto de milhar) | "1771.19" -> 1771.19 (ponto decimal)
function parseValor(txt){
  let s=String(txt==null?'':txt).trim().replace(/[^\d.,]/g,'');
  if(!s) return NaN;
  if(s.indexOf(',')>=0){
    s=s.replace(/\./g,'').replace(',','.');            // vírgula é o decimal
  }else{
    const p=s.split('.');
    if(p.length>2) s=p.join('');                        // 1.234.567
    else if(p.length===2 && p[1].length===3) s=p.join(''); // 1.771 = milhar
  }
  const n=parseFloat(s);
  return isNaN(n)?NaN:n;
}
function brl(n){ return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function comHora(d){ return String(d).length===10 ? d+'T12:00:00' : d; }
function dm(d){ return new Date(comHora(d)).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}); }
function inicioDia(d){ d=d||new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime(); }

  ['ENTRADA','SAIDA','DESPESA'].forEach(function(t){ if(!m[t].length) m[t]=CATS[t]||['Outros']; });
  CATS=m;
}

async function renomearCategoria(id){
  const cat=categoriasFull.filter(function(c){ return c.id===id; })[0]; if(!cat) return;
  const novoNome=(prompt('Novo nome para "'+cat.nome+'":', cat.nome)||'').trim();
  if(!novoNome || novoNome===cat.nome) return;
  const uso=contaUsoCategoria(cat.nome);
  if(uso && !confirm('Renomear e atualizar '+uso+' lançamento(s) de "'+cat.nome+'" para "'+novoNome+'"?')) return;
  try{
    await api('categorias?id=eq.'+id,{method:'PATCH',body:JSON.stringify({nome:novoNome})});
    // atualiza os lançamentos e contas que usavam o nome antigo
    const movs=movimentos.filter(function(m){ return (m.categoria||'')===cat.nome; });
    const cts=contas.filter(function(c){ return (c.categoria||'')===cat.nome; });
    for(let i=0;i<movs.length;i++) await api('movimentos?id=eq.'+movs[i].id,{method:'PATCH',body:JSON.stringify({categoria:novoNome})});
    for(let i=0;i<cts.length;i++) await api('contas?id=eq.'+cts[i].id,{method:'PATCH',body:JSON.stringify({categoria:novoNome})});
    const lista=await api('categorias?select=*&order=nome.asc'); montarCategorias(lista);
    await recarregar(); fecharFolha(); abrirGerenciarCategorias();
  }catch(e){ alert(e.message); }
}
async function excluirCategoria(id){
  const cat=categoriasFull.filter(function(c){ return c.id===id; })[0]; if(!cat) return;
  const uso=contaUsoCategoria(cat.nome);
  if(uso){
    alert('Não dá para excluir "'+cat.nome+'": há '+uso+' lançamento(s) usando ela.\n\nRenomeie esses lançamentos primeiro (ou reclassifique-os) e depois exclua.');
    return;
  }
  if(!confirm('Excluir a categoria "'+cat.nome+'"?')) return;
  try{
    await api('categorias?id=eq.'+id,{method:'DELETE'});
    const lista=await api('categorias?select=*&order=nome.asc'); montarCategorias(lista);
    fecharFolha(); abrirGerenciarCategorias();

}

function resumoVendas(){ const d0=inicioDia(),am=d0+86400000,s0=am-7*86400000,m0=new Date(new Date().getFullYear(),new Date().getMonth(),1).getTime(); return {dia:somaMov('ENTRADA',d0,am,'Venda'),semana:somaMov('ENTRADA',s0,am,'Venda'),mes:somaMov('ENTRADA',m0,am,'Venda')}; }
function saldoDia(){ const d0=inicioDia(),am=d0+86400000; return {ent:somaMov('ENTRADA',d0,am),sai:somaMov('SAIDA',d0,am)}; }
function estoqueDe(p){ return Number(p.estoque||0); }
function diasAte(d){ return Math.round((new Date(comHora(d))-new Date())/86400000); }
function statusValidade(v){ if(!v)return null; const dias=diasAte(v); if(dias<0)return {t:'Vencido',c:'var(--rose)',bg:'#FDECEC'}; if(dias<=30)return {t:'Vence em '+dias+'d',c:'var(--amber)',bg:'#FEF3D9'}; return {t:'Val. '+dm(v),c:'var(--muted)',bg:'#EEF2F0'}; }

// Filtro das abas: Boletos e Despesas são contas a pagar; A receber é o que entra.
function filtroAba(a){
  if(a==='RECEBER') return function(c){ return c.tipo==='RECEBER'; };
  if(a==='BOLETO')  return function(c){ return c.tipo==='PAGAR' && c.origem==='BOLETO'; };
  if(a==='DESPESA') return function(c){ return c.tipo==='PAGAR' && c.origem!=='BOLETO'; };
  return function(c){ return c.tipo==='PAGAR'; };   // 'PAGAR' = todas as contas a pagar
}
function contasOrd(aba){
  const lista = contas.filter(filtroAba(aba));
  if(aba==='DESPESA'){
    // pendentes primeiro (vencimento mais próximo no topo, pedem ação);
    // pagas depois, ordenadas pela data em que o pagamento aconteceu —
    // é essa data que interessa numa despesa já quitada, não o vencimento.
    return lista.sort(function(a,b){
      const pa=a.status!=='PAGO', pb=b.status!=='PAGO';
      if(pa!==pb) return pa?-1:1;
      if(pa) return new Date(a.venc)-new Date(b.venc);
      const da=a.dataBaixa?new Date(a.dataBaixa).getTime():new Date(a.venc).getTime();
      const db=b.dataBaixa?new Date(b.dataBaixa).getTime():new Date(b.venc).getTime();
      return db-da;
    });
  }
  return lista.sort(function(a,b){ return new Date(a.venc)-new Date(b.venc); });
}

function resultadosBusca(){
  const alvo=document.getElementById('bqRes'); if(!alvo) return;
  const q=(buscaTexto||'').trim().toLowerCase();
  const qNum=parseValor(buscaTexto);
  const de=buscaDe?new Date(buscaDe+'T00:00:00').getTime():null;
  const ate=buscaAte?new Date(buscaAte+'T00:00:00').getTime()+86400000:null;

  function combina(texto,valor,ts){
    if(de && ts<de) return false;
    if(ate && ts>=ate) return false;
    if(!q) return true;
    if(String(texto||'').toLowerCase().indexOf(q)>=0) return true;
    if(!isNaN(qNum) && Math.abs(valor-qNum)<0.005) return true;
    return false;
  }

  let itens=[];
  if(buscaTipo!=='CONTAS'){
    movimentos.forEach(function(m){
      if(buscaTipo==='SAIDA'&&m.tipo!=='SAIDA') return;
      if(buscaTipo==='ENTRADA'&&m.tipo!=='ENTRADA') return;
      if(combina((m.desc||'')+' '+(m.categoria||''), m.valor, m.ts))
        itens.push({tipo:'mov', id:m.id, ts:m.ts, titulo:m.desc||m.categoria||'Lançamento',
                    sub:(m.categoria||'')+' · '+dm(dataLocal(m.ts)),
                    valor:m.valor, entrada:m.tipo==='ENTRADA'});
    });
  }
  if(buscaTipo==='TODOS'||buscaTipo==='CONTAS'){
    contas.forEach(function(c){
      const ts=new Date(c.venc+'T12:00:00').getTime();
      if(combina((c.desc||'')+' '+(c.categoria||'')+' '+(c.documento||''), c.valor, ts))
        itens.push({tipo:'conta', id:c.id, ts:ts, titulo:c.desc,
                    sub:(c.status==='PAGO'?'Pago':'Em aberto')+' · vence '+dm(c.venc)+(c.documento?' · nº '+c.documento:''),
                    valor:c.valor, entrada:c.tipo==='RECEBER'});
    });
  }
  itens.sort(function(a,b){ return b.ts-a.ts; });

  const total=itens.reduce(function(s,x){ return s+(x.entrada?x.valor:-x.valor); },0);
  const soma=itens.reduce(function(s,x){ return s+x.valor; },0);

  if(!itens.length){ alvo.innerHTML='<div class="vazio">Nada encontrado. Tente outra palavra ou limpe as datas.</div>'; return; }

  alvo.innerHTML='<div class="totalAberto"><span>'+itens.length+' resultado(s)</span><strong>'+brl(soma)+'</strong></div>'+
    itens.slice(0,80).map(function(x){
      return '<div class="item" style="margin-top:8px'+(x.tipo==='mov'?';cursor:pointer" onclick="fecharFolha();abrirEditar(\''+x.id+'\')':'"')+'>'+
        '<div style="flex:1"><div style="font-size:14px;font-weight:500">'+x.titulo+'</div>'+
        '<div style="font-size:11.5px;color:var(--muted)">'+x.sub+'</div></div>'+
        '<div class="val2" style="color:'+(x.entrada?'var(--emerald)':'var(--rose)')+'">'+brl(x.valor)+'</div></div>';
    }).join('')+
    (itens.length>80?'<div class="dica">Mostrando os 80 mais recentes. Refine a busca para ver menos.</div>':'');
}
// Varre o que já está cadastrado e mostra possíveis repetições
function conferirDuplicados(){
  const achados=[];
  for(let i=0;i<contas.length;i++){
    for(let j=i+1;j<contas.length;j++){
      const a=contas[i], b=contas[j];
      let motivo=null;
      if(a.documento && b.documento && a.documento===b.documento) motivo='mesmo número de boleto';
      else if(a.linha && b.linha && a.linha===b.linha) motivo='mesma linha digitável';
      else if(Math.abs(a.valor-b.valor)<0.005 && a.venc===b.venc && textoIgual(a.desc,b.desc)) motivo='mesmo valor, vencimento e descrição';
      if(motivo) achados.push({a:a,b:b,motivo:motivo,tipo:'Conta'});
    }
  }
  for(let i=0;i<movimentos.length;i++){
    for(let j=i+1;j<movimentos.length;j++){
      const a=movimentos[i], b=movimentos[j];
      if(a.tipo!==b.tipo) continue;
      if(Math.abs(a.valor-b.valor)>=0.005) continue;
      if(dataLocal(a.ts)!==dataLocal(b.ts)) continue;
      if(!textoIgual(a.desc,b.desc)) continue;
      achados.push({a:{desc:a.desc,valor:a.valor,venc:dataLocal(a.ts)},
                    b:{desc:b.desc,valor:b.valor,venc:dataLocal(b.ts)},
                    motivo:'mesmo dia, valor e descrição', tipo:'Lançamento', idB:b.id});
    }
  }
  abrirFolha('Conferência de repetidos',
    achados.length
      ? '<div class="totalAberto"><span>'+achados.length+' possível(is) repetição(ões)</span></div>'+
        achados.slice(0,40).map(function(x){
          return '<div class="item" style="margin-top:8px;display:block">'+
            '<div style="font-size:14px;font-weight:500">'+x.a.desc+' — '+brl(x.a.valor)+'</div>'+
            '<div style="font-size:11.5px;color:var(--muted);margin-top:3px">'+x.tipo+' · '+x.motivo+' · '+dm(x.a.venc)+'</div>'+
            (x.idB?'<button class="pagarBtn" style="color:var(--rose);background:#FDECEC;margin-top:6px" onclick="apagarMov(\''+x.idB+'\')">Excluir a segunda cópia</button>':'')+
          '</div>';
        }).join('')
      : '<div class="vazio">Nenhuma repetição encontrada. Está tudo certo.</div>');
}
// Painel dos próximos meses (mês atual + 3 seguintes)
function painelMeses(lista){
  const abertas=lista.filter(function(c){ return c.status!=='PAGO'; });
  if(!abertas.length) return '';
  const hoje=new Date();
  const blocos=[];
  for(let k=0;k<4;k++){
    const d=new Date(hoje.getFullYear(), hoje.getMonth()+k, 1);
    const ano=d.getFullYear(), mes=d.getMonth()+1;
    const ini=new Date(ano,mes-1,1).getTime();
    const fim=new Date(ano,mes,1).getTime();
    const doMes=abertas.filter(function(c){
      const t=new Date(c.venc+'T12:00:00').getTime();
      return t>=ini && t<fim;
    });
    // no mês corrente, inclui também o que já venceu e não foi pago
    let atrasadas=[];
    if(k===0) atrasadas=abertas.filter(function(c){ return new Date(c.venc+'T12:00:00').getTime()<ini; });
    const todas=doMes.concat(atrasadas);
    const total=todas.reduce(function(s,c){ return s+c.valor; },0);
    blocos.push({
      chave:ano+'-'+String(mes).padStart(2,'0'),
      rot:NOMES_MES[mes-1]+'/'+String(ano).slice(2),
      qtd:todas.length, total:total,
      atual:k===0, atrasadas:atrasadas.length
    });
  }
  const maior=blocos.reduce(function(m,b){ return Math.max(m,b.total); },0);
  const somaTudo=blocos.reduce(function(s,b){ return s+b.total; },0);

  return '<h2 class="sec">Próximos meses</h2>'+
    '<div class="msLista">'+
      blocos.map(function(b){
        const pct=maior?Math.round(b.total/maior*100):0;
        const on=filtroMes===b.chave;
        return '<button class="msCard'+(on?' msOn':'')+'" onclick="filtroMes=\''+(on?'':b.chave)+'\';filtroVenc=\'todos\';render()">'+
          '<div class="msTopo"><span class="msRot">'+b.rot+(b.atual?' · atual':'')+'</span>'+
          '<strong class="msVal">'+brl(b.total)+'</strong></div>'+
          '<div class="msBarra"><span style="width:'+pct+'%"></span></div>'+
          '<div class="msQtd">'+b.qtd+' conta'+(b.qtd===1?'':'s')+
            (b.atrasadas?' · '+b.atrasadas+' atrasada'+(b.atrasadas===1?'':'s'):'')+'</div>'+
        '</button>';
      }).join('')+

let filtroMes='';
function aplicaFiltroMes(lista){
  if(!filtroMes) return lista;
  const [ano,mes]=filtroMes.split('-').map(Number);
  const ini=new Date(ano,mes-1,1).getTime();
  const fim=new Date(ano,mes,1).getTime();
  const hoje=new Date();
  const ehAtual = (ano===hoje.getFullYear() && mes===hoje.getMonth()+1);
  return lista.filter(function(c){
    if(c.status==='PAGO') return false;
    const t=new Date(c.venc+'T12:00:00').getTime();
    if(ehAtual && t<ini) return true;      // atrasadas entram no mês corrente
    return t>=ini && t<fim;
  });
}

function seriesMeses(qtd){
  const hoje=new Date();
  const lista=[];
  for(let k=qtd-1;k>=0;k--){
    const d=new Date(hoje.getFullYear(), hoje.getMonth()-k, 1);
    const ano=d.getFullYear(), mes=d.getMonth()+1;
    const R=resumoMes(ano,mes);
    lista.push({ano:ano,mes:mes,rot:NOMES_MES[mes-1]+'/'+String(ano).slice(2),
      vendas:R.vendas, ent:R.ent, sai:R.sai, saldo:R.saldo, atual:(k===0)});
  }
  return lista;
}
// Soma todo o histórico já lançado, desde o primeiro movimento.
function saldoAcumuladoTotal(){
  let ent=0, sai=0, primeiro=null, saldoInicial=0;
  movimentos.forEach(function(m){
    if(m.tipo==='ENTRADA') ent+=m.valor; else sai+=m.valor;
    if(m.categoria==='Saldo Inicial') saldoInicial+=m.valor;
    if(primeiro===null || m.ts<primeiro) primeiro=m.ts;
  });
  return {ent:ent, sai:sai, saldo:ent-sai, desde:primeiro, saldoInicial:saldoInicial};
}

// Cartão "acumulado x mês atual". Reutilizado na tela inicial e na Evolução.
// Se não receber o mês atual pronto (chamada a partir do Início), calcula sozinho.
function cartaoSaldoAcumulado(atualPronto){
  const hoje=new Date();
  const atual = atualPronto || (function(){
    const R=resumoMes(hoje.getFullYear(), hoje.getMonth()+1);
    return {rot:NOMES_MES[hoje.getMonth()]+'/'+String(hoje.getFullYear()).slice(2), saldo:R.saldo};
  })();
  const T=saldoAcumuladoTotal();
  if(!T.desde) return '';
  const contrib = T.saldo!==0 ? (atual.saldo/T.saldo*100) : null;
  const mesTotalPositivo = atual.saldo>=0;
  const geralPositivo = T.saldo>=0;
  const desdeTxt = new Date(T.desde).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  return '<div class="acCompara">'+
      '<div class="acLado">'+
        '<div class="acRot">Acumulado desde '+desdeTxt+'</div>'+
        '<div class="acVal" style="color:'+(geralPositivo?'var(--emerald)':'var(--rose)')+'">'+brl(T.saldo)+'</div>'+
      '</div>'+
      '<div class="acSeparador"></div>'+
      '<div class="acLado">'+
        '<div class="acRot">Só '+atual.rot+'</div>'+
        '<div class="acVal" style="color:'+(mesTotalPositivo?'var(--emerald)':'var(--rose)')+'">'+brl(atual.saldo)+'</div>'+
      '</div>'+
    '</div>'+
    (contrib!==null
      ? '<div class="dica" style="text-align:center;margin-top:6px">'+
          (Math.abs(contrib)<=100
            ? 'Este mês representa '+Math.abs(contrib).toFixed(0)+'% do saldo acumulado'
            : (contrib>0
                ? 'Este mês sozinho é maior que todo o acumulado — os meses anteriores estavam no negativo'
                : 'Este mês está puxando o acumulado para baixo'))+
        '</div>'
      : '')+
    (T.saldoInicial
      ? '<div class="dica" style="text-align:center;margin-top:2px">Inclui '+brl(T.saldoInicial)+' de saldo inicial de caixa</div>'
      : '');
}

function semAcento(t){
  return String(t||'').toLowerCase()
    .replace(/[áàâã]/g,'a').replace(/[éê]/g,'e').replace(/í/g,'i')
    .replace(/[óôõ]/g,'o').replace(/ú/g,'u').replace(/ç/g,'c');
}
// Devolve a categoria provável para uma descrição, ou null
function sugerirCategoria(descricao,tipo){
  const t=semAcento(descricao);
  if(t.length<3) return null;
  const disponiveis=(CATS[tipo]||[]).concat(CATS.SAIDA||[]);
  for(let i=0;i<PISTAS.length;i++){
    const cat=PISTAS[i][0], palavras=PISTAS[i][1];
    for(let j=0;j<palavras.length;j++){
      if(t.indexOf(semAcento(palavras[j]))>=0){
        if(disponiveis.indexOf(cat)>=0) return cat;
      }
    }
  }
  // se já houve lançamento com descrição parecida, repete a categoria dele
  const parecido=movimentos.filter(function(m){
    return m.categoria && m.desc && semAcento(m.desc).indexOf(t)>=0;
  })[0];
  return parecido?parecido.categoria:null;
}
// Mostra o aviso "sugerido: X" e marca o chip correspondente
function aplicarSugestao(idDesc,idChips,tipo,callbackEscolha){
  const campo=document.getElementById(idDesc); if(!campo) return;
  const cat=sugerirCategoria(campo.value,tipo);
  const aviso=document.getElementById(idChips+'Sug');
  if(!aviso) return;
  if(!cat){ aviso.innerHTML=''; return; }
  aviso.innerHTML='Sugestão: <button class="chipSug" onclick="'+callbackEscolha+'(\''+cat+'\')">'+cat+'</button>';
}
// Ordena as categorias colocando as mais usadas primeiro
function categoriasOrdenadas(tipo){
  const uso={};
  movimentos.forEach(function(m){ if(m.categoria) uso[m.categoria]=(uso[m.categoria]||0)+1; });
  contas.forEach(function(c){ if(c.categoria) uso[c.categoria]=(uso[c.categoria]||0)+1; });
  return (CATS[tipo]||[]).slice().sort(function(a,b){ return (uso[b]||0)-(uso[a]||0); });
}

  const o=operadores.filter(function(x){ return x.email===email; })[0]; if(!o) return;
  const novo=!o.visao_simples;
  try{
    await api('operadores?email=eq.'+encodeURIComponent(email),{method:'PATCH',body:JSON.stringify({visao_simples:novo})});
    o.visao_simples=novo;
    await registrar(novo?'BLOQUEOU':'LIBEROU','Usuário',(o.nome||email)+' — '+(novo?'visão de acompanhamento':'app completo'),null);
    fecharFolha(); abrirAdministracao();
  }catch(e){ alert(e.message); }
}
async function alternarPermissao(campo){
  if(!souAdmin){ alert('Área exclusiva do administrador.'); return; }
  const novo = permissoes[campo]===false;
  const corpo={}; corpo[campo]=novo; corpo.atualizado_em=new Date().toISOString();
  try{
    await api('permissoes_operadores?id=eq.1',{method:'PATCH',body:JSON.stringify(corpo)});
    permissoes[campo]=novo;
    await registrar(novo?'LIBEROU':'BLOQUEOU','Permissão',campo,null);
    fecharFolha(); abrirAdministracao();
  }catch(e){ alert('Não consegui alterar: '+e.message); }
}

// Monta um pacote com tudo do banco. Serve para guardar fora do app
// (Drive, e-mail, WhatsApp) e para restaurar se algo se perder.
async function montarBackup(){
  const alvos=['movimentos','contas','produtos','categorias','recorrentes','beneficiarios','historico'];
  const pacote={ app:'Farma Familia', versao:1, gerado_em:new Date().toISOString(), tabelas:{} };
  for(let i=0;i<alvos.length;i++){
    try{ pacote.tabelas[alvos[i]]=await api(alvos[i]+'?select=*')||[]; }
    catch(e){ pacote.tabelas[alvos[i]]=[]; }
  }
  return pacote;
}
function nomeArquivoBackup(){
  const d=new Date();
  const p=function(n){ return String(n).padStart(2,'0'); };
  return 'backup-farmafamilia-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+'.json';
}
async function baixarBackup(){
  const b=document.getElementById('bkBtn');
  if(b){ b.textContent='Gerando…'; b.disabled=true; }
  try{
    const pacote=await montarBackup();
    const txt=JSON.stringify(pacote);
    const blob=new Blob([txt],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=nomeArquivoBackup(); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); },2000);
    // guarda também uma cópia local (última salva) e a data
    try{ localStorage.setItem('ultimoBackup', new Date().toISOString()); }catch(e){}
    const cont=totaisBackup(pacote);
    if(b){ b.textContent='Salvar backup'; b.disabled=false; }
    alert('Backup gerado.\n\n'+cont+'\n\nGuarde o arquivo no Drive, e-mail ou WhatsApp. Se precisar, ele restaura tudo.');
  }catch(e){
    if(b){ b.textContent='Salvar backup'; b.disabled=false; }
    alert('Não consegui gerar o backup: '+e.message);
  }
}
function totaisBackup(pacote){
  const t=pacote.tabelas||{};
  return (t.movimentos||[]).length+' lançamentos · '+
         (t.contas||[]).length+' contas · '+
         (t.categorias||[]).length+' categorias';
}
function ultimoBackupTexto(){
  try{
    const iso=localStorage.getItem('ultimoBackup');
    if(!iso) return 'Nenhum backup salvo ainda.';
    const d=new Date(iso), ag=new Date();
    const dias=Math.floor((ag-d)/86400000);
    const quando=d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    return 'Último backup: '+quando+(dias>=3?' — faz '+dias+' dias, vale gerar um novo':'');
  }catch(e){ return ''; }
}

// Restauração: relê um arquivo de backup e reinsere o que estiver faltando
function abrirRestaurar(){
  abrirFolha('Restaurar backup',
    '<div class="dica" style="margin-top:0">Selecione um arquivo de backup (.json). O app vai <b>adicionar de volta</b> os registros que não existem mais. Nada do que está hoje é apagado.</div>'+
    '<label class="foto" style="margin-top:10px"><span>'+IC.baixar+' Escolher arquivo de backup</span>'+
    '<input type="file" accept=".json,application/json" onchange="restaurarBackup(event)" style="display:none"/></label>'+
    '<div id="rsAviso" class="dica"></div>');
}
async function restaurarBackup(ev){
  const f=ev.target.files[0]; if(!f) return;
  const aviso=document.getElementById('rsAviso');
  if(aviso){ aviso.innerHTML='<span class="girando">◜</span> Lendo o arquivo…'; aviso.style.color='var(--muted)'; }
  let pacote=null;
  try{ pacote=JSON.parse(await f.text()); }
  catch(e){ if(aviso){ aviso.textContent='Arquivo inválido.'; aviso.style.color='var(--rose)'; } return; }
  if(!pacote.tabelas){ if(aviso){ aviso.textContent='Este arquivo não parece um backup do Farma Família.'; aviso.style.color='var(--rose)'; } return; }
  if(!confirm('Restaurar a partir de '+(pacote.gerado_em?new Date(pacote.gerado_em).toLocaleString('pt-BR'):'?')+'?\n\n'+totaisBackup(pacote)+'\n\nSó serão adicionados registros que não existem hoje.')) return;

  // ids já presentes, para não duplicar
  const existentes={};
  ['movimentos','contas','categorias','recorrentes','beneficiarios'].forEach(function(tb){
    existentes[tb]={};
    (tb==='movimentos'?movimentos:tb==='contas'?contas:[]).forEach(function(x){ existentes[tb][x.id]=1; });
  });
  let add=0;
  async function repoe(tb){
    const linhas=pacote.tabelas[tb]||[];
    for(let i=0;i<linhas.length;i++){
      const row=linhas[i];
      try{
        await api(tb,{method:'POST',headers:{'Prefer':'resolution=ignore-duplicates'},body:JSON.stringify(row)});
        add++;
      }catch(e){ /* já existe */ }
    }
  }
  try{
    // ordem importa: contas antes de movimentos (por causa do vínculo)
    await repoe('categorias'); await repoe('recorrentes'); await repoe('beneficiarios');
    await repoe('contas'); await repoe('movimentos');
    await recarregar(); fecharFolha();
    alert('Restauração concluída. '+add+' registro(s) adicionado(s) de volta.');
  }catch(e){ if(aviso){ aviso.textContent=e.message; aviso.style.color='var(--rose)'; } }
}

// Lembrete: se faz muitos dias sem backup, avisa uma vez ao abrir
function lembrarBackup(){
  try{
    const iso=localStorage.getItem('ultimoBackup');
    const hoje=hojeISO();
    if(localStorage.getItem('avisoBackupDia')===hoje) return;
    let dias=99;
    if(iso) dias=Math.floor((Date.now()-new Date(iso).getTime())/86400000);
    if(dias>=7){
      localStorage.setItem('avisoBackupDia',hoje);
      setTimeout(function(){
        if(confirm('Faz '+(iso?dias+' dias':'um tempo')+' que não é feito um backup dos dados.\n\nQuer gerar um agora? (leva alguns segundos)')) baixarBackup();
      },1500);
    }
  }catch(e){}
}

// Recupera um lançamento/conta que foi excluído, a partir da cópia guardada no log
async function restaurarDoHistorico(idLog){
  let reg=null;
  try{ const r=await api('historico?id=eq.'+idLog+'&select=*'); reg=r&&r[0]; }catch(e){}
  if(!reg||!reg.detalhe){ alert('Não há dados guardados para recuperar este item.'); return; }
  const d=reg.detalhe;
  if(!confirm('Recuperar "'+(d.descricao||reg.descricao||'')+'"?')) return;
  try{
    if(reg.entidade==='Entrada'||reg.entidade==='Saída'){
      await api('movimentos',{method:'POST',body:JSON.stringify({
        tipo:d.tipo, categoria:d.categoria, valor:d.valor, descricao:d.descricao, data_hora:d.data_hora||new Date().toISOString()
      })});
    }else{
      await api('contas',{method:'POST',body:JSON.stringify({
        tipo:d.tipo, origem:d.origem, categoria:d.categoria, valor:d.valor,
        vencimento:d.vencimento, status:d.status||'PENDENTE', descricao:d.descricao, documento:d.documento
      })});
    }
    await registrar('CRIOU', reg.entidade, (d.descricao||'')+' (recuperado)', d.valor);
    await recarregar(); fecharFolha();
    alert('Recuperado com sucesso.');
  }catch(e){ alert(e.message); }
}

// ============================================================
//  AUDITORIA — confere se as tabelas estão sincronizadas
// ============================================================
function normNome(t){ return String(t||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }

function rodarAuditoria(){
  const p=[];   // problemas encontrados
  const mapaContas={}; contas.forEach(function(c){ mapaContas[c.id]=c; });
  const movPorConta={}; movimentos.forEach(function(m){ if(m.contaId) (movPorConta[m.contaId]=movPorConta[m.contaId]||[]).push(m); });

  // 1) conta paga sem lançamento no caixa
  contas.forEach(function(c){
    if(c.status==='PAGO' && !(movPorConta[c.id]||[]).length)
      p.push({g:'Conta paga sem lançamento no caixa', t:c.desc+' — '+brl(c.valor), corrige:null});
  });
  // 2) lançamento ligado a conta não paga
  movimentos.forEach(function(m){
    const c=m.contaId?mapaContas[m.contaId]:null;
    if(c && c.status!=='PAGO')
      p.push({g:'Lançamento existe, mas a conta está em aberto', t:c.desc+' — '+brl(c.valor), corrige:{tipo:'marcarPago', id:c.id}});
  });
  // 3,4,5) divergências entre conta e lançamento
  movimentos.forEach(function(m){
    const c=m.contaId?mapaContas[m.contaId]:null; if(!c) return;
    if((m.categoria||'')!==(c.categoria||''))
      p.push({g:'Categoria diferente entre conta e caixa', t:c.desc+': conta "'+(c.categoria||'sem')+'" x caixa "'+(m.categoria||'sem')+'"',
              corrige:{tipo:'catConta', id:c.id, valor:m.categoria}});
    if(Math.abs(m.valor-c.valor)>0.005)
      p.push({g:'Valor diferente entre conta e caixa', t:c.desc+': '+brl(c.valor)+' x '+brl(m.valor), corrige:null});
    if(!textoIgual(m.desc,c.desc))
      p.push({g:'Descrição diferente entre conta e caixa', t:'"'+c.desc+'" x "'+m.desc+'"',
              corrige:{tipo:'descMov', id:m.id, valor:c.desc}});
  });
  // 6) sem categoria
  contas.forEach(function(c){ if(!c.categoria) p.push({g:'Conta sem categoria', t:c.desc+' — '+brl(c.valor), corrige:null}); });
  movimentos.forEach(function(m){ if(!m.categoria) p.push({g:'Lançamento sem categoria', t:(m.desc||'—')+' — '+brl(m.valor), corrige:null}); });

  // 7) nomes parecidos (possível mesma empresa escrita diferente)
  const nomes={};
  contas.forEach(function(c){ if(c.tipo==='PAGAR') nomes[c.desc]=(nomes[c.desc]||0)+1; });
  movimentos.forEach(function(m){ if(m.tipo==='SAIDA'&&m.desc) nomes[m.desc]=(nomes[m.desc]||0)+1; });
  const chaves=Object.keys(nomes);
  const jaVistos={};
  for(let i=0;i<chaves.length;i++){
    for(let j=i+1;j<chaves.length;j++){
      const a=chaves[i], b=chaves[j];
      const na=normNome(a), nb=normNome(b);
      if(na===nb) continue;
      const iguaisOrdenadas = na.split('').sort().join('')===nb.split('').sort().join('');
      const curto=na.length<nb.length?na:nb, longo=na.length<nb.length?nb:na;
      const umDentroDoOutro = curto.length>=2 && longo.length>curto.length+2 && longo.indexOf(curto)===0;
      if(iguaisOrdenadas || umDentroDoOutro){
        const k=[a,b].sort().join('||'); if(jaVistos[k]) continue; jaVistos[k]=1;
        p.push({g:'Nomes parecidos — pode ser a mesma empresa', t:'"'+a+'" ('+nomes[a]+'x) e "'+b+'" ('+nomes[b]+'x)',
                corrige:{tipo:'unificar', de:(nomes[a]<nomes[b]?a:b), para:(nomes[a]<nomes[b]?b:a)}});
      }
    }
  }
  return p;
}

function abrirAuditoria(){
  const p=rodarAuditoria();
  const grupos={};
  p.forEach(function(x){ (grupos[x.g]=grupos[x.g]||[]).push(x); });
  const nomesG=Object.keys(grupos);

  abrirFolha('Auditoria dos dados',
    (p.length
      ? '<div class="totalAberto" style="background:#FDECEC;border-color:#F0C4CB;color:var(--rose)">'+
          '<span>'+p.length+' ponto(s) a revisar</span><strong>'+nomesG.length+' tipo(s)</strong></div>'+
        nomesG.map(function(g){
          return '<h2 class="sec" style="margin-top:12px">'+g+' ('+grupos[g].length+')</h2>'+
            grupos[g].map(function(x,idx){
              const chave=g+'|'+idx;
              return '<div class="item" style="margin-top:6px;display:block">'+
                '<div style="font-size:13.5px">'+x.t+'</div>'+
                (x.corrige?'<button class="pagarBtn" style="margin-top:6px" onclick="corrigirAuditoria(\''+encodeURIComponent(JSON.stringify(x.corrige))+'\')">Corrigir</button>':
                           '<div class="dica" style="margin-top:4px">Revise manualmente.</div>')+
              '</div>';
            }).join('');
        }).join('')
      : '<div class="vazio">Tudo sincronizado. Nenhuma inconsistência encontrada.</div>')+
    '<div class="dica">Verifica: contas x caixa (valor, data, categoria, descrição), itens sem categoria e nomes escritos de formas diferentes.</div>');
}

async function corrigirAuditoria(dadosEnc){
  const d=JSON.parse(decodeURIComponent(dadosEnc));
  try{
    if(d.tipo==='catConta'){
      await api('contas?id=eq.'+d.id,{method:'PATCH',body:JSON.stringify({categoria:d.valor||null})});
    }else if(d.tipo==='descMov'){
      await api('movimentos?id=eq.'+d.id,{method:'PATCH',body:JSON.stringify({descricao:d.valor})});
    }else if(d.tipo==='marcarPago'){
      await api('contas?id=eq.'+d.id,{method:'PATCH',body:JSON.stringify({status:'PAGO'})});
    }else if(d.tipo==='unificar'){
      if(!confirm('Passar tudo que está como "'+d.de+'" para "'+d.para+'"?')) return;
      const movs=movimentos.filter(function(m){ return m.desc===d.de; });
      const cts=contas.filter(function(c){ return c.desc===d.de; });
      for(let i=0;i<movs.length;i++) await api('movimentos?id=eq.'+movs[i].id,{method:'PATCH',body:JSON.stringify({descricao:d.para})});
      for(let i=0;i<cts.length;i++) await api('contas?id=eq.'+cts[i].id,{method:'PATCH',body:JSON.stringify({descricao:d.para})});
    }
    await recarregar();
    fecharFolha(); abrirAuditoria();
  }catch(e){ alert(e.message); }
}
// ============================================================
//  PAINEL DE VENCIMENTOS (contas em aberto por período)
// ============================================================
function fimDaSemana(){   // próximos 7 dias, contando hoje
  return inicioDia()+7*86400000;
}
function fimDoMes(){
  const d=new Date();
  return new Date(d.getFullYear(), d.getMonth()+1, 1).getTime();
}
function painelVencimentos(lista){
  const abertas=lista.filter(function(c){ return c.status!=='PAGO'; });
  const hoje0=inicioDia(), amanha=hoje0+86400000;
  const grupo={atrasado:[], hoje:[], semana:[], mes:[], depois:[]};
  abertas.forEach(function(c){
    const t=new Date(c.venc+'T12:00:00').getTime();
    if(t<hoje0) grupo.atrasado.push(c);
    else if(t<amanha) grupo.hoje.push(c);
    else if(t<fimDaSemana()) grupo.semana.push(c);
    else if(t<fimDoMes()) grupo.mes.push(c);
    else grupo.depois.push(c);
  });
  const soma=function(a){ return a.reduce(function(s,c){ return s+c.valor; },0); };
  const totalGeral=soma(abertas);

  if(!abertas.length) return '';

  function bloco(rot,arr,cor,fundo,filtro){
    return '<button class="vcCard" style="background:'+fundo+'" onclick="filtroVenc=\''+filtro+'\';render()">'+
      '<div class="vcRot" style="color:'+cor+'">'+rot+'</div>'+
      '<div class="vcVal" style="color:'+cor+'">'+brl(soma(arr))+'</div>'+
      '<div class="vcQtd">'+arr.length+' conta'+(arr.length===1?'':'s')+'</div></button>';
  }
  // acumulados: semana inclui hoje e atrasados; mês inclui tudo até o fim do mês
  const ateHoje=grupo.atrasado.concat(grupo.hoje);
  const ateSemana=ateHoje.concat(grupo.semana);
  const ateMes=ateSemana.concat(grupo.mes);

  return '<section class="vcTotal">'+
      '<div class="vcTotalRot">Total em aberto</div>'+
      '<div class="vcTotalVal">'+brl(totalGeral)+'</div>'+
      '<div class="vcTotalSub">'+abertas.length+' conta'+(abertas.length===1?'':'s')+
        (grupo.atrasado.length?' · '+grupo.atrasado.length+' em atraso':'')+'</div>'+
    '</section>'+
    '<div class="vcGrade">'+
      bloco('Vence hoje', ateHoje, 'var(--rose)', '#FDECEC', 'hoje')+
      bloco('Nesta semana', ateSemana, '#8A5A00', '#FDF1DC', 'semana')+
      bloco('Neste mês', ateMes, 'var(--pine)', 'var(--amberSoft)', 'mes')+
      bloco('Depois', grupo.depois, 'var(--muted)', '#EEEAE9', 'depois')+
    '</div>'+
    (filtroVenc!=='todos'
      ? '<button class="btnS" style="width:100%" onclick="filtroVenc=\'todos\';render()">Mostrando: '+rotuloFiltro(filtroVenc)+' — ver todas</button>'
      : '');
}
let filtroVenc='todos';
function rotuloFiltro(f){
  return f==='hoje'?'vence hoje e atrasadas':f==='semana'?'até 7 dias':f==='mes'?'até o fim do mês':f==='depois'?'depois deste mês':'todas';
}
function aplicaFiltroVenc(lista){
  if(filtroVenc==='todos') return lista;
  const hoje0=inicioDia(), amanha=hoje0+86400000;
  return lista.filter(function(c){
    if(c.status==='PAGO') return false;
    const t=new Date(c.venc+'T12:00:00').getTime();
    if(filtroVenc==='hoje')   return t<amanha;
    if(filtroVenc==='semana') return t<fimDaSemana();
    if(filtroVenc==='mes')    return t<fimDoMes();
    if(filtroVenc==='depois') return t>=fimDoMes();
    return true;
  });
}

function competenciaAtual(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }

// Gera as contas do mês corrente que ainda não existem
async function gerarRecorrentes(){
  const comp=competenciaAtual();
  const [ano,mes]=comp.split('-').map(Number);
  let criadas=0;
  for(let i=0;i<recorrentes.length;i++){
    const r=recorrentes[i];
    if(!r.ativo || r.ultimo_mes===comp) continue;
    const ultimoDia=new Date(ano,mes,0).getDate();
    const dia=Math.min(r.dia,ultimoDia);
    const venc=ano+'-'+String(mes).padStart(2,'0')+'-'+String(dia).padStart(2,'0');
    try{
      await api('contas',{method:'POST',body:JSON.stringify({
        tipo:r.tipo, origem:r.origem, categoria:r.categoria,
        descricao:r.descricao, valor:r.valor, vencimento:venc,
        status:'PENDENTE', recorrente_id:r.id, competencia:comp
      })});
      await api('recorrentes?id=eq.'+r.id,{method:'PATCH',body:JSON.stringify({ultimo_mes:comp})});
      criadas++;
    }catch(e){ /* já existe: índice único impede duplicar */ }
  }
  if(criadas){ await carregarRecorrentes(); await recarregar(); }
  return criadas;
}

function limitesMes(ano,mes){                 // mes: 1-12
  return [new Date(ano,mes-1,1).getTime(), new Date(ano,mes,1).getTime()];
}
// Categorias que representam ponto de partida, não movimento do mês.
// Entram no saldo acumulado total, mas ficam fora do desempenho mensal.
const CATS_FORA_DO_MES=['Saldo Inicial'];
function resumoMes(ano,mes){
  const iv=limitesMes(ano,mes);
  let ent=0, sai=0;
  movimentos.forEach(function(m){
    if(m.ts<iv[0]||m.ts>=iv[1]) return;
    if(CATS_FORA_DO_MES.indexOf(m.categoria)>=0) return;   // saldo inicial não é "resultado do mês"
    if(m.tipo==='ENTRADA') ent+=m.valor; else sai+=m.valor;
  });
  const vendas=somaMov('ENTRADA',iv[0],iv[1],'Venda');
  const cats={};
  movimentos.forEach(function(m){
    if(m.tipo!=='SAIDA'||m.ts<iv[0]||m.ts>=iv[1]) return;
    const c=m.categoria||'Outros'; cats[c]=(cats[c]||0)+m.valor;
  });
  return {ent:ent, sai:sai, saldo:ent-sai, vendas:vendas, cats:cats};
}
function variacao(atual,anterior){
  if(!anterior) return atual? {txt:'novo', cor:'var(--muted)'} : {txt:'—', cor:'var(--muted)'};
  const p=((atual-anterior)/anterior)*100;
  const sinal=p>=0?'+':'';
  return {txt:sinal+p.toFixed(0)+'%', cor:p>=0?'var(--emerald)':'var(--rose)', pct:p};
}

// ---- Verificação de lançamento repetido ----
function textoIgual(a,b){ return String(a||'').trim().toLowerCase()===String(b||'').trim().toLowerCase(); }

// Procura uma conta já cadastrada igual à que está sendo salva
function contaRepetida(d){
  for(let i=0;i<contas.length;i++){
    const c=contas[i];
    if(d.documento && c.documento && c.documento===d.documento)
      return {conta:c, motivo:'mesmo número de boleto ('+d.documento+')', forte:true};
    if(d.linha && c.linha && c.linha===d.linha)
      return {conta:c, motivo:'mesma linha digitável', forte:true};
    if(Math.abs(c.valor-d.valor)<0.005 && c.venc===d.vencimento && textoIgual(c.desc,d.descricao))
      return {conta:c, motivo:'mesmo valor, vencimento e descrição', forte:false};
  }
  return null;
}

// Procura um lançamento de caixa igual (mesmo dia, valor e descrição)
function movimentoRepetido(d){
  const dia=String(d.data).slice(0,10);
  for(let i=0;i<movimentos.length;i++){
    const m=movimentos[i];
    const diaM=dataLocal(m.ts);
    if(m.tipo===d.tipo && Math.abs(m.valor-d.valor)<0.005 && diaM===dia && textoIgual(m.desc,d.descricao))
      return m;
  }
  return null;
}

// Mostra o aviso e devolve true se a pessoa quiser salvar mesmo assim
function confirmarRepetido(r){
  const c=r.conta;
  const msg='ATENÇÃO — parece repetido.\n\n'+
    'Já existe: '+c.desc+'\n'+
    'Valor: '+brl(c.valor)+'\n'+
    'Vencimento: '+dm(c.venc)+'\n'+
    (c.status==='PAGO'?'Situação: já pago\n':'')+
    '\nMotivo: '+r.motivo+'\n\nSalvar assim mesmo?';
  return confirm(msg);
}
// ---- Identificação do beneficiário pelo código de barras ----
// O nome da distribuidora NÃO vem no código de barras. O que vem é banco +
// campo livre, e dentro do campo livre estão a agência/conta do beneficiário.
// O problema: cada banco (e cada carteira) põe esses dados numa posição
// diferente. Em vez de tentar adivinhar o layout, guardamos o código inteiro
// e comparamos POSIÇÃO POR POSIÇÃO com os já conhecidos: os dígitos da conta
// são iguais entre boletos da mesma empresa, onde quer que estejam.
let beneficiarios=[];   // [{chave,nome,codigo_barras,banco,vezes}]

function campoLivreDe(cb){
  const d=String(cb).replace(/\D/g,'');
  return d.length===44 ? d.slice(19,44) : null;
}
function bancoDe(cb){
  const d=String(cb).replace(/\D/g,'');
  return d.length===44 ? d.slice(0,3) : null;
}
// chave grosseira: banco + começo do campo livre (carteira/convênio costuma ser estável)
function chaveBeneficiario(cb){
  const d=String(cb).replace(/\D/g,'');
  const cl=campoLivreDe(d);
  if(!cl) return null;
  return d.slice(0,3)+'-'+cl.slice(0,6);
}
// quantas posições do campo livre coincidem entre dois códigos
function semelhanca(cbA,cbB){
  const a=campoLivreDe(cbA), b=campoLivreDe(cbB);
  if(!a||!b) return 0;
  let iguais=0;
  for(let i=0;i<25;i++) if(a[i]===b[i]) iguais++;
  return iguais;
}
// Procura a empresa mais parecida. Exige banco igual e semelhança alta,
// para não sugerir o fornecedor errado.
const MIN_SEMELHANCA=13;      // de 25 posições do campo livre
function reconhecerBeneficiario(cb){
  const banco=bancoDe(cb);
  if(!banco) return null;
  let melhor=null, melhorPonto=0, segundoPonto=0;
  for(let i=0;i<beneficiarios.length;i++){
    const b=beneficiarios[i];
    if(b.banco && b.banco!==banco) continue;
    let ponto=0;
    if(b.codigo_barras){
      ponto=semelhanca(cb,b.codigo_barras);
    }else if(b.chave && b.chave===chaveBeneficiario(cb)){
      ponto=MIN_SEMELHANCA;   // compatibilidade com o que foi aprendido antes
    }
    if(ponto>melhorPonto){ segundoPonto=melhorPonto; melhorPonto=ponto; melhor=b; }
    else if(ponto>segundoPonto){ segundoPonto=ponto; }
  }
  if(melhor && melhorPonto>=MIN_SEMELHANCA) return {nome:melhor.nome, forca:melhorPonto};
  return null;
}
// "Nosso número" — extração aproximada, só para exibir/registrar
function documentoDe(cb){
  const d=String(cb).replace(/\D/g,'');
  const cl=campoLivreDe(d);
  if(!cl) return null;
  if(d.slice(0,3)==='341') return cl.slice(0,3)+'/'+cl.slice(3,11)+'-'+cl.slice(11,12);
  return cl.slice(0,11);
}
async function carregarBeneficiarios(){
  try{ beneficiarios=await api('beneficiarios?select=*')||[]; }
  catch(e){ beneficiarios=[]; }
}
// Guarda o código lido junto do nome informado. Se já houver um registro
// muito parecido com o mesmo nome, apenas conta mais uma ocorrência.
async function aprenderBeneficiario(cb,nome){
  if(!cb||!nome) return;
  const banco=bancoDe(cb);
  const jaTem=beneficiarios.filter(function(b){
    return b.nome===nome && b.codigo_barras && semelhanca(cb,b.codigo_barras)>=24;
  })[0];
  if(jaTem) return;
  try{
    await api('beneficiarios',{method:'POST',body:JSON.stringify({
      chave:chaveBeneficiario(cb), nome:nome, codigo_barras:cb, banco:banco
    })});
    await carregarBeneficiarios();
  }catch(e){}
}

// ---- Vencimento do boleto (fator de vencimento FEBRABAN) ----
// O contador de 4 dígitos chegou a 9999 em 21/02/2025 e recomeçou em 1000
// no dia 22/02/2025. Por isso o mesmo fator pode significar duas datas:
// uma na contagem antiga (base 07/10/1997) e outra na nova (base 22/02/2025).
// Escolhemos a que fizer mais sentido em relação a hoje.
const BASE_VENC=Date.UTC(1997,9,7);           // contagem antiga
const BASE_VENC_NOVA=Date.UTC(2025,1,22);     // contagem nova (fator 1000)
function dataDoFator(fator){
  if(!fator||fator<=0) return null;
  const antiga=new Date(BASE_VENC + fator*86400000);
  const nova=(fator>=1000) ? new Date(BASE_VENC_NOVA + (fator-1000)*86400000) : null;
  if(!nova) return antiga;
  const hoje=Date.now();
  return Math.abs(nova-hoje) < Math.abs(antiga-hoje) ? nova : antiga;
}
// Linha digitável (47 dígitos)
function decodificarLinha(linha){
  const d=String(linha).replace(/\D/g,''); if(d.length!==47)return null;
  const c=parseInt(d.slice(37,47),10);
  return { valor: isNaN(c)?null:c/100, vencimento: dataDoFator(parseInt(d.slice(33,37),10)) };
}
// Código de barras do boleto (44 dígitos)
function decodificarCodigoBarras(cb){
  const d=String(cb).replace(/\D/g,''); if(d.length!==44)return null;
  const c=parseInt(d.slice(9,19),10);
  return { valor: isNaN(c)?null:c/100, vencimento: dataDoFator(parseInt(d.slice(5,9),10)) };
}

// Lê a FOTO do boleto e extrai valor e vencimento pelo código de barras.
// A foto NÃO é guardada — serve só para a leitura.
async function lerBoletoDaFoto(arquivo){
  if(!('BarcodeDetector' in window)){
    throw new Error('Este navegador não lê código de barras. Use o Chrome no Android, ou digite a linha do boleto.');
  }
  let formatos=['itf','code_128','codabar','code_39'];
  try{
    const suportados=await BarcodeDetector.getSupportedFormats();
    formatos=formatos.filter(function(f){ return suportados.indexOf(f)>=0; });
    if(!formatos.length) formatos=suportados;
  }catch(e){}
  const detector=new BarcodeDetector({formats:formatos});
  const img=await createImageBitmap(arquivo);
  const codigos=await detector.detect(img);
  if(img.close) img.close();
  for(let i=0;i<codigos.length;i++){
    const d=String(codigos[i].rawValue||'').replace(/\D/g,'');
    if(d.length===44){ const r=decodificarCodigoBarras(d); if(r) return r; }
    if(d.length===47){ const r=decodificarLinha(d); if(r) return r; }
  }
  throw new Error('Não encontrei o código de barras. Aproxime mais, com boa luz, e enquadre só a faixa de barras.');
}

function hojeISO(){ return dataLocal(Date.now()); }
// Converte qualquer instante (timestamp) na data do calendário LOCAL.
// Nunca usar toISOString().slice(0,10) para isso: toISOString() é UTC e,
// à noite no Brasil (UTC-3), empurra a data para o dia seguinte.
function dataLocal(ts){
  const d=new Date(ts);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
// Monta o horário do lançamento: se for hoje, usa a hora atual; se for
// retroativo, usa meio-dia daquele dia.
function montarDataHora(dataISO){
  if(!dataISO || dataISO===hojeISO()) return new Date().toISOString();
  return new Date(dataISO+'T12:00:00').toISOString();
}
// Formata o campo enquanto a pessoa digita, preenchendo vírgula e
// ponto sozinho. Os dígitos entram pelos centavos, da direita para a
// esquerda: 1 -> 0,01 | 177 -> 1,77 | 177119 -> 1.771,19
function mascaraMoeda(el){
  let d=String(el.value).replace(/\D/g,'').replace(/^0+/,'');
  if(!d){ el.value=''; return; }
  if(d.length>11) d=d.slice(0,11);            // limite de segurança
  const n=parseInt(d,10)/100;
  el.value=n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
// Preenche um campo de valor já formatado (usado pelo boleto)
function porValorNoCampo(id,valor){
  const el=document.getElementById(id); if(!el) return;
  el.value=Number(valor).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}

// Lançamentos podem ser corrigidos ou apagados por até 72h após serem feitos.
const PRAZO_EDICAO=72*3600*1000;
function podeEditar(m){
  if(!m.criadoEm) return true;
  return (Date.now()-m.criadoEm) < PRAZO_EDICAO;
}
function horasRestantes(m){
  if(!m.criadoEm) return null;
  const resta=PRAZO_EDICAO-(Date.now()-m.criadoEm);
  if(resta<=0) return 0;
  return Math.ceil(resta/3600000);
}

function importarXml(ev){
  const f=ev.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=async function(){
    try{
      const xml=new DOMParser().parseFromString(r.result,'text/xml');
      const dets=xml.getElementsByTagName('det');
      if(!dets.length){ alert('Nenhum item encontrado no XML.'); return; }
      let add=0;
      for(let i=0;i<dets.length;i++){
        const det=dets[i];
        const g=function(t){ const el=det.getElementsByTagName(t)[0]; return el?el.textContent:null; };
        const desc=g('xProd'); if(!desc)continue;
        const qtd=Number(g('qCom')||0);
        const ean=g('cEAN'); const cod=(ean&&ean!=='SEM GTIN')?ean:null;
        const rastro=det.getElementsByTagName('rastro')[0];
        const valEl=rastro?rastro.getElementsByTagName('dVal')[0]:null;
        const val=valEl?valEl.textContent:null;
        const ex=produtos.filter(function(x){ return (cod&&x.codigo===cod)||x.desc.toLowerCase()===desc.toLowerCase(); })[0];
        if(ex){
          const corpo={estoque:Number(ex.estoque||0)+qtd};
          if(val&&!ex.validade) corpo.validade=val;
          await api('produtos?id=eq.'+ex.id,{method:'PATCH',body:JSON.stringify(corpo)});
        }else{
          await api('produtos',{method:'POST',body:JSON.stringify({descricao:desc,codigo_barras:cod,estoque:qtd,estoque_minimo:0,validade:val})});
        }
        add++;
      }
      await recarregar();
      alert(add+' itens importados da nota.');
    }catch(e){ alert('Não consegui importar: '+e.message); }
  };
  r.readAsText(f);
}

async function salvarConta(continuar){
  const v=parseValor(document.getElementById('cv').value);
  const campoPagto=document.getElementById('cdpag');
  const dPago=(contaJaPaga&&campoPagto)?campoPagto.value:'';
  // Se a conta já foi paga, a data do pagamento vale como referência —
  // não é preciso lembrar o vencimento original.
  let venc=document.getElementById('cvenc').value || (contaJaPaga?dPago:'');
  if(!v||isNaN(v)){ alert('Informe o valor.'); return; }
  if(!venc){
    alert(contaJaPaga
      ? 'Informe a data do pagamento.'
      : 'Informe o vencimento.\n\nSe a conta já foi paga, ligue "Já foi paga" e informe a data do pagamento.');
    return;
  }
  const el=document.getElementById('cl');
  const boleto = contaAba==='BOLETO';
  const despesa = contaAba==='DESPESA';
  const descricao=document.getElementById('cd').value.trim()||(boleto?'Boleto':despesa?'Despesa':'Recebimento');
  const docNum = ultimoCodigoLido?documentoDe(ultimoCodigoLido):null;
  const dataPag=dPago||venc;
  const rep=contaRepetida({descricao:descricao, valor:v, vencimento:venc, documento:docNum,
                           linha:(el&&el.value.replace(/\D/g,''))||null});
  if(rep && !confirmarRepetido(rep)) return;
  const b=document.getElementById('cBtn'); b.textContent='Salvando…'; b.disabled=true;
  try{
    const criadaResp=await api('contas',{method:'POST',body:JSON.stringify({
      tipo: contaAba==='RECEBER'?'RECEBER':'PAGAR',
      origem: boleto?'BOLETO':'MANUAL',
      categoria: despesa?despCat:null,
      descricao:document.getElementById('cd').value.trim()||(boleto?'Boleto':despesa?'Despesa':'Recebimento'),
      valor:v, vencimento:venc,
      status: contaJaPaga?'PAGO':'PENDENTE',
      data_baixa: contaJaPaga?montarDataHora(dataPag):null,
      linha_digitavel:(el&&el.value.replace(/\D/g,''))||null,
      documento: ultimoCodigoLido?documentoDe(ultimoCodigoLido):null
    })});
    // se já foi paga, lança no caixa junto e deixa os dois ligados
    if(contaJaPaga){
      // usa o id devolvido pela própria criação (evita pegar a conta de outra pessoa)
      const idNova=(criadaResp&&criadaResp[0])?criadaResp[0].id:null;
      await api('movimentos',{method:'POST',body:JSON.stringify({
        tipo: contaAba==='RECEBER'?'ENTRADA':'SAIDA',
        categoria: despesa?despCat:(boleto?'Distribuidor':'Outros'),
        valor:v, descricao:descricao,
        data_hora:montarDataHora(dataPag),
        conta_id:idNova
      })});
    }
    await registrar(contaJaPaga?'PAGOU':'CRIOU', boleto?'Boleto':despesa?'Despesa':'A receber', descricao, v);
    if(boleto && ultimoCodigoLido){
      await aprenderBeneficiario(ultimoCodigoLido, document.getElementById('cd').value.trim());
    }
    ultimoCodigoLido=null;
    fecharFolha(); await recarregar();
    if(continuar){ abrirConta(); setTimeout(abrirScannerBoleto,120); }
  }catch(e){ alert(e.message); b.textContent='Salvar'; b.disabled=false; }
}

let scannerStream=null, scannerLoop=null;
function suportaLeitura(){ return ('BarcodeDetector' in window) && navigator.mediaDevices && navigator.mediaDevices.getUserMedia; }

// Diz exatamente o que falta para a leitura funcionar neste aparelho
async function diagnosticoLeitura(){
  const p=[];
  if(!window.isSecureContext) p.push('a página precisa estar em HTTPS');
  if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)) p.push('o navegador não dá acesso à câmera');
  if(!('BarcodeDetector' in window)) p.push('o navegador não tem leitor de código de barras (BarcodeDetector)');
  else{
    try{
      const sup=await BarcodeDetector.getSupportedFormats();
      const uteis=['itf','code_128','codabar','code_39'].filter(function(f){ return sup.indexOf(f)>=0; });
      if(!uteis.length) p.push('o leitor não suporta o formato de boleto (ITF). Formatos disponíveis: '+(sup.join(', ')||'nenhum'));
    }catch(e){ p.push('não consegui consultar os formatos suportados'); }
  }
  return p;
}
async function abrirScannerBoleto(){
  const problemas=await diagnosticoLeitura();
  if(problemas.length){
    alert('A leitura pela câmera não funciona neste aparelho porque:\n\n· '+problemas.join('\n· ')+
          '\n\nUse a opção de digitar a linha do boleto — o valor e o vencimento são preenchidos sozinhos.');
    return;
  }
  const ov=document.createElement('div');
  ov.className='scanner'; ov.id='scanner';
  ov.innerHTML='<video id="scVideo" playsinline muted></video>'+
    '<div class="scMira"></div>'+
    '<div class="scAviso">Aponte para o código de barras<br><small style="font-weight:400;opacity:.85">funciona na vertical ou na horizontal</small></div>'+
    '<button class="scFechar" onclick="pararScanner()">Cancelar</button>';
  document.body.appendChild(ov);

  try{
    scannerStream=await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720} }
    });
  }catch(e){
    pararScanner();
    alert('Não consegui abrir a câmera. Verifique a permissão do navegador.');
    return;
  }
  const video=document.getElementById('scVideo');
  if(!video){ pararScanner(); return; }
  video.srcObject=scannerStream;
  try{ await video.play(); }catch(e){}

  let formatos=['itf','code_128','codabar','code_39'];
  try{
    const sup=await BarcodeDetector.getSupportedFormats();
    const f=formatos.filter(function(x){ return sup.indexOf(x)>=0; });
    if(f.length) formatos=f;
  }catch(e){}
  const detector=new BarcodeDetector({formats:formatos});

  // Lê alternando entre a imagem normal e girada 90°, para funcionar
  // com o celular na vertical ou na horizontal, mesmo com a tela travada.
  const tela=document.createElement('canvas');
  const ctx=tela.getContext('2d',{willReadFrequently:true});
  let giro=0;

  scannerLoop=setInterval(async function(){
    const v=document.getElementById('scVideo');
    if(!v||v.readyState<2) return;
    const w=v.videoWidth, h=v.videoHeight;
    if(!w||!h) return;

    if(giro%2===0){
      tela.width=w; tela.height=h;
      ctx.setTransform(1,0,0,1,0,0);
      ctx.drawImage(v,0,0,w,h);
    }else{
      tela.width=h; tela.height=w;
      ctx.setTransform(1,0,0,1,0,0);
      ctx.clearRect(0,0,tela.width,tela.height);
      ctx.translate(h/2,w/2);
      ctx.rotate(Math.PI/2);
      ctx.drawImage(v,-w/2,-h/2,w,h);
    }
    giro++;

    let codigos=[];
    try{ codigos=await detector.detect(tela); }catch(e){ return; }
    for(let i=0;i<codigos.length;i++){
      const d=String(codigos[i].rawValue||'').replace(/\D/g,'');
      let r=null;
      if(d.length===44) r=decodificarCodigoBarras(d);
      else if(d.length===47) r=decodificarLinha(d);
      if(r && r.valor){
        if(navigator.vibrate) navigator.vibrate(60);
        pararScanner();
        aplicarLeitura(r,d);
        return;
      }
    }
  },250);
}

function pararScanner(){
  if(scannerLoop){ clearInterval(scannerLoop); scannerLoop=null; }
  if(scannerStream){ scannerStream.getTracks().forEach(function(t){ t.stop(); }); scannerStream=null; }
  const ov=document.getElementById('scanner'); if(ov) ov.remove();
}

// Preenche o formulário com o que foi lido do boleto
function aplicarLeitura(r,digitos){
  if(r.valor!=null){ porValorNoCampo('cv',r.valor); previa('cv','cPrev'); }
  if(r.vencimento){ const cvc=document.getElementById('cvenc'); if(cvc) cvc.value=r.vencimento.toISOString().slice(0,10); }
  const cl=document.getElementById('cl');
  if(cl && digitos && digitos.length===47) cl.value=digitos;

  // guarda o código de barras (converte da linha, se for o caso)
  let cb=null;
  if(digitos && digitos.length===44) cb=digitos;
  else if(digitos && digitos.length===47) cb=linhaParaBarras(digitos);
  ultimoCodigoLido=cb;

  let extra='';
  if(cb){
    const doc=documentoDe(cb);
    if(doc) extra+=' · nº '+doc;
    const r2=reconhecerBeneficiario(cb);
    const cd=document.getElementById('cd');
    if(r2 && cd && !cd.value){ cd.value=r2.nome; extra+=' · '+r2.nome; }
  }
  const aviso=document.getElementById('cFoto');
  if(aviso){
    aviso.textContent='Lido: '+brl(r.valor)+(r.vencimento?' · vence '+dm(r.vencimento.toISOString().slice(0,10)):'')+extra;
    aviso.style.color='var(--emerald)';
  }

  if(cd2 && !cd2.value) cd2.focus();
}

// Converte a linha digitável (47) para o código de barras (44)
function linhaParaBarras(l){
  const d=String(l).replace(/\D/g,'');
  if(d.length!==47) return null;
  return d.slice(0,4)+d[32]+d.slice(33,47)+d.slice(4,9)+d.slice(10,20)+d.slice(21,31);
}
// Confere o dígito verificador geral do boleto (módulo 11)
function dvBarrasOk(cb){
  const d=String(cb).replace(/\D/g,'');
  if(d.length!==44) return false;
  const semDv=d.slice(0,4)+d.slice(5);
  let peso=2, soma=0;
  for(let i=semDv.length-1;i>=0;i--){
    soma+=parseInt(semDv[i],10)*peso;
    peso++; if(peso>9) peso=2;
  }
  let dv=11-(soma%11);
  if(dv===0||dv>9) dv=1;
  return dv===parseInt(d[4],10);
}
// Lê o que foi digitado: aceita linha digitável (47) ou código de barras (44)
function lerDigitado(txt){
  const d=String(txt||'').replace(/\D/g,'');
  if(d.length===47){
    const cb=linhaParaBarras(d);
    return { pronto:true, dados:decodificarLinha(d), dvOk:dvBarrasOk(cb), faltam:0, tem:47, alvo:47 };
  }
  if(d.length===44){
    return { pronto:true, dados:decodificarCodigoBarras(d), dvOk:dvBarrasOk(d), faltam:0, tem:44, alvo:44 };
  }
  const alvo = d.length>44 ? 47 : 44;
  return { pronto:false, dados:null, dvOk:null, faltam:Math.max(0,alvo-d.length), tem:d.length, alvo:alvo };
}
// Chamada a cada tecla digitada no campo da linha
function autoLinha(){
  const campo=document.getElementById('cl'); if(!campo) return;
  const aviso=document.getElementById('cFoto');
  const r=lerDigitado(campo.value);

  if(!r.pronto){
    // ainda incompleto: limpa para não ficar valor velho na tela
    const cv=document.getElementById('cv'), cvc=document.getElementById('cvenc');
    if(cv){ cv.value=''; previa('cv','cPrev'); }
    if(cvc) cvc.value='';
    if(aviso){
      aviso.style.color='var(--muted)';
      aviso.textContent = r.tem===0 ? '' : 'Digitado '+r.tem+' de '+r.alvo+' números — faltam '+r.faltam+'.';
    }
    return;
  }
  if(!r.dados || r.dados.valor==null){
    if(aviso){ aviso.style.color='var(--rose)'; aviso.textContent='Não consegui interpretar esses números.'; }
    return;
  }
  const digitos=String(campo.value).replace(/\D/g,'');
  aplicarLeitura(r.dados, digitos);
  if(r.dvOk===false){
    if(aviso){ aviso.style.color='var(--rose)'; aviso.textContent='Atenção: os números não batem no dígito verificador. Confira antes de salvar.'; }
  }
  return;
  if(r.dados.valor!=null){ porValorNoCampo('cv',r.dados.valor); previa('cv','cPrev'); }
  if(r.dados.vencimento){ const cvc=document.getElementById('cvenc'); if(cvc) cvc.value=r.dados.vencimento.toISOString().slice(0,10); }
  if(aviso){
    if(r.dvOk===false){
      aviso.style.color='var(--rose)';
      aviso.textContent='Atenção: os números não batem no dígito verificador. Confira antes de salvar.';
    }else{
      aviso.style.color='var(--emerald)';
      aviso.textContent='Lido: '+brl(r.dados.valor)+(r.dados.vencimento?' · vence '+dm(r.dados.vencimento.toISOString().slice(0,10)):'');
    }
  }
}

  }catch(e){ alert(e.message); }

//  RELATÓRIOS
// ============================================================
let relPeriodo='semanal',relDe='',relAte='';
function intervalo(){
  const d0=inicioDia(),am=d0+86400000;
  if(relPeriodo==='diario')return[d0,am];
  if(relPeriodo==='semanal')return[am-7*86400000,am];
  if(relPeriodo==='mensal')return[new Date(new Date().getFullYear(),new Date().getMonth(),1).getTime(),am];
  if(relPeriodo==='custom'&&relDe&&relAte)return[new Date(relDe+'T00:00:00').getTime(),new Date(relAte+'T00:00:00').getTime()+86400000];
  return null;
}
// Agrupa os lançamentos do período por categoria, do maior para o menor
function porCategoria(tipo,inicio,fim){
  const mapa={};
  movimentos.forEach(function(m){
    if(m.tipo!==tipo||m.ts<inicio||m.ts>=fim) return;
    const c=m.categoria||'Sem categoria';
    mapa[c]=(mapa[c]||0)+m.valor;
  });
  return Object.keys(mapa).map(function(c){ return {cat:c,total:mapa[c]}; })
    .sort(function(a,b){ return b.total-a.total; });
}
function blocoCategorias(titulo,tipo,iv,cor){
  const lista=porCategoria(tipo,iv[0],iv[1]);
  if(!lista.length) return '';
  const soma=lista.reduce(function(s,x){ return s+x.total; },0);
  return '<h2 class="sec">'+titulo+'</h2>'+
    lista.map(function(x){
      const pct=soma>0?Math.round(x.total/soma*100):0;
      return '<div class="catLinha" onclick="verCategoria(\''+encodeURIComponent(x.cat)+'\',\''+tipo+'\')">'+
        '<div class="catTopo"><span>'+x.cat+'</span><strong>'+brl(x.total)+'</strong></div>'+
        '<div class="catBarra"><div style="width:'+pct+'%;background:'+cor+'"></div></div>'+
        '<div class="catPct">'+pct+'% · toque para ver os lançamentos</div></div>';
    }).join('');
}
// Mostra os lançamentos de uma categoria no período selecionado
function verCategoria(catEnc,tipo){
  const cat=decodeURIComponent(catEnc);
  const iv=intervalo(); if(!iv) return;
  const itens=movimentos.filter(function(m){
    return m.tipo===tipo && m.ts>=iv[0] && m.ts<iv[1] && (m.categoria||'Sem categoria')===cat;
  }).sort(function(a,b){ return a.ts-b.ts; });
  const soma=itens.reduce(function(s,m){ return s+m.valor; },0);
  abrirFolha(cat,
    '<div class="totalAberto"><span>'+itens.length+' lançamento(s)</span><strong>'+brl(soma)+'</strong></div>'+
    itens.map(function(m){
      return '<div class="item" style="margin-top:8px"><div style="flex:1">'+
        '<div style="font-size:14px;font-weight:500">'+(m.desc||cat)+'</div>'+
        '<div style="font-size:11.5px;color:var(--muted)">'+dm(dataLocal(m.ts))+'</div></div>'+
        '<div class="val2">'+brl(m.valor)+'</div></div>';
    }).join(''));
}
function vRel(){
  const per=[['diario','Diário'],['semanal','Semanal'],['mensal','Mensal'],['custom','Período']];
  const iv=intervalo();
  let corpo='';
  if(!iv) corpo='<div class="vazio">Selecione as datas do período.</div>';
  else{
    const ent=somaMov('ENTRADA',iv[0],iv[1]),sai=somaMov('SAIDA',iv[0],iv[1]);
    corpo='<section class="item" style="display:block">'+
      '<div style="font-size:12px;color:var(--muted)">Saldo do período</div>'+
      '<div class="val2" style="font-size:24px">'+brl(ent-sai)+'</div>'+
      '<div style="display:flex;gap:16px;margin-top:8px;font-size:13px"><span style="color:var(--emerald)">▲ Entradas '+brl(ent)+'</span><span style="color:var(--rose)">▼ Saídas '+brl(sai)+'</span></div>'+
    '</section>'+
    blocoCategorias('Saídas por categoria','SAIDA',iv,'var(--rose)')+
    blocoCategorias('Entradas por categoria','ENTRADA',iv,'var(--emerald)')+
    '<button class="btnS" style="width:100%;margin-top:6px" onclick="exportarCsv()">'+IC.baixar+' Exportar em CSV (Excel)</button>'+
    '<button class="btnS" style="width:100%;margin-top:8px" onclick="abrirEvolucao()">Evolução da farmácia (6 meses)</button>'+
    '<button class="btnS" style="width:100%;margin-top:8px" onclick="abrirComparativo()">Comparar com o mês anterior</button>';
  }
  return '<div class="chips">'+per.map(function(p){ return '<button class="chip '+(relPeriodo===p[0]?'on':'')+'" onclick="relPeriodo=\''+p[0]+'\';render()">'+p[1]+'</button>'; }).join('')+'</div>'+
    (relPeriodo==='custom'?'<div class="duo"><div style="flex:1"><label class="campo">De</label><input type="date" value="'+relDe+'" onchange="relDe=this.value;render()"/></div><div style="flex:1"><label class="campo">Até</label><input type="date" value="'+relAte+'" onchange="relAte=this.value;render()"/></div></div>':'')+
    corpo;
}
function exportarCsv(){
  const iv=intervalo(); if(!iv)return;
  const linhas=[['Data','Hora','Tipo','Categoria','Descricao','Valor']];
  movimentos.filter(function(m){ return m.ts>=iv[0]&&m.ts<iv[1]; }).sort(function(a,b){ return a.ts-b.ts; }).forEach(function(m){
    const d=new Date(m.ts);
    linhas.push([d.toLocaleDateString('pt-BR'),d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),m.tipo,m.categoria||'',(m.desc||'').replace(/;/g,','),m.valor.toFixed(2)]);
  });
  const ent=somaMov('ENTRADA',iv[0],iv[1]),sai=somaMov('SAIDA',iv[0],iv[1]);
  linhas.push([]);
  linhas.push(['','','','','TOTAL ENTRADAS',ent.toFixed(2)]);
  linhas.push(['','','','','TOTAL SAIDAS',sai.toFixed(2)]);
  linhas.push(['','','','','SALDO',(ent-sai).toFixed(2)]);
  const csv='\uFEFF'+linhas.map(function(l){ return l.join(';'); }).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='relatorio-'+relPeriodo+'.csv'; a.click();
}

// ============================================================
//  Folha (modal)
// ============================================================
function abrirFolha(titulo,html,apos){
  const ov=document.createElement('div'); ov.className='overlay'; ov.id='overlay';
  ov.onclick=function(e){ if(e.target===ov) fecharFolha(); };
  ov.innerHTML='<div class="folha"><div class="folhaTopo"><span class="folhaTitulo">'+titulo+'</span><button class="fechar" onclick="fecharFolha()">✕</button></div>'+html+'</div>';
  document.body.appendChild(ov); if(apos) apos();
}
function fecharFolha(){ pararScanner(); const o=document.getElementById('overlay'); if(o) o.remove(); }

// ============================================================
//  Início
// ============================================================
async function aposCarregar(){
  try{ await carregarRecorrentes(); await gerarRecorrentes(); }catch(e){}
  try{ avisarVencimentos(false); }catch(e){}
  try{ lembrarBackup(); }catch(e){}
}
async function iniciar(){
  document.getElementById('raiz').innerHTML='<div style="display:grid;place-items:center;height:100vh;background:var(--pine)"><span class="girando" style="color:var(--amber);font-size:34px">◜</span></div>';
  try{ await carregarTudo(); montarApp(); aposCarregar(); }
  catch(e){ Sessao.limpar(); mostrarLogin('Não consegui conectar. Verifique a internet e entre novamente.'); }
}

const _s=Sessao.ler();
if(_s && _s.token) iniciar(); else mostrarLogin();

document.addEventListener('visibilitychange',function(){
  const s=Sessao.ler();
  if(!document.hidden && s && s.token && document.getElementById('main')) recarregar();
});

if('serviceWorker' in navigator){
  window.addEventListener('load',function(){ navigator.serviceWorker.register('service-worker.js').catch(function(){}); });
}
